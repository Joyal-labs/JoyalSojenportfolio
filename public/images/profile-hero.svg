<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <radialGradient id="halo" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#0a0a0f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22242d" />
      <stop offset="50%" stop-color="#14161c" />
      <stop offset="100%" stop-color="#0d0e12" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2b998" />
      <stop offset="100%" stop-color="#c59876" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242c" />
      <stop offset="100%" stop-color="#0d0f13" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="250" cy="240" r="210" fill="url(#halo)" />

  <!-- Abstract Tech Grid Accent Behind -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1.2">
    <circle cx="250" cy="240" r="190" fill="none" stroke-dasharray="6,8" />
    <circle cx="250" cy="240" r="230" fill="none" stroke-dasharray="4,12" />
    <line x1="50" y1="240" x2="450" y2="240" stroke-dasharray="4,6" />
  </g>

  <!-- Developer Silhouette / Stylized Portrait matching Figma reference -->
  <g id="character">
    <!-- Torso / Dark T-Shirt -->
    <path d="M140 440 C140 375, 180 340, 250 340 C320 340, 360 375, 360 440 L385 540 C385 550, 375 560, 360 560 L140 560 C125 560, 115 550, 115 540 Z" fill="url(#bodyGrad)" stroke="#2e3440" stroke-width="2" />
    
    <!-- T-Shirt Graphic / Print -->
    <rect x="220" y="380" width="60" height="20" rx="4" fill="#38bdf8" opacity="0.8" />
    <text x="250" y="394" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0d0e12" text-anchor="middle">&lt;DEV /&gt;</text>
    <line x1="215" y1="412" x2="285" y2="412" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="225" y1="422" x2="275" y2="422" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M226 270 L226 345 C235 352, 265 352, 274 345 L274 270 Z" fill="url(#skin)" />
    <!-- Neck shadow under chin -->
    <path d="M226 270 Q250 295 274 270 L274 290 Q250 315 226 290 Z" fill="#9e7355" opacity="0.35" />

    <!-- Head / Face -->
    <ellipse cx="250" cy="225" rx="55" ry="68" fill="url(#skin)" />

    <!-- Beard / Stubble like the Figma photo -->
    <path d="M198 220 Q200 278, 250 292 Q300 278, 302 220 Q305 260, 285 285 Q250 300, 215 285 Q195 260, 198 220 Z" fill="#1b1d24" opacity="0.85" />

    <!-- Ears -->
    <ellipse cx="192" cy="225" rx="8" ry="14" fill="#d2a382" />
    <ellipse cx="308" cy="225" rx="8" ry="14" fill="#d2a382" />

    <!-- Hair (styled modern pompadour/fade like reference) -->
    <path d="M190 200 C185 145, 230 130, 255 130 C290 130, 315 155, 310 200 C305 185, 290 170, 250 170 C210 170, 195 185, 190 200 Z" fill="url(#hair)" />
    <path d="M192 195 C190 160, 220 140, 255 140 C290 140, 310 160, 308 195 C295 180, 275 175, 250 175 C225 175, 205 180, 192 195 Z" fill="#2d3340" />

    <!-- Eyes and Eyebrows -->
    <path d="M215 208 Q226 204, 235 208" stroke="#1c1f26" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M265 208 Q274 204, 285 208" stroke="#1c1f26" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="226" cy="218" r="4.5" fill="#1c1f26" />
    <circle cx="228" cy="216" r="1.5" fill="#ffffff" />
    <circle cx="274" cy="218" r="4.5" fill="#1c1f26" />
    <circle cx="276" cy="216" r="1.5" fill="#ffffff" />

    <!-- Nose -->
    <path d="M250 216 L250 240 Q254 243, 256 240" stroke="#a27453" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Modern Glasses (stylish tech aesthetic) -->
    <g stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.9">
      <rect x="210" y="206" width="34" height="24" rx="6" />
      <rect x="256" y="206" width="34" height="24" rx="6" />
      <path d="M244 216 L256 216" />
      <path d="M210 214 L193 218" />
      <path d="M290 214 L307 218" />
      <!-- Subtle lens reflection -->
      <line x1="216" y1="212" x2="238" y2="224" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
      <line x1="262" y1="212" x2="284" y2="224" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
    </g>

    <!-- Smile / Mouth -->
    <path d="M236 262 Q250 270, 264 262" stroke="#8c5839" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Glowing Rim Light / Edge Highlights -->
  <path d="M142 450 C142 390, 180 345, 245 342" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M358 450 C358 390, 320 345, 255 342" stroke="#818cf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Code Floating Badge Tag -->
  <g transform="translate(340, 220)">
    <rect width="115" height="38" rx="19" fill="#141721" stroke="#252b3b" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#10b981" />
    <text x="36" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Available to Work</text>
  </g>

  <!-- Experience Floating Badge Tag -->
  <g transform="translate(45, 360)">
    <rect width="125" height="46" rx="14" fill="#141721" stroke="#252b3b" stroke-width="1.5" />
    <text x="20" y="22" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" fill="#38bdf8">3+ Years</text>
    <text x="20" y="36" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Frontend &amp; UI/UX</text>
  </g>
</svg>

