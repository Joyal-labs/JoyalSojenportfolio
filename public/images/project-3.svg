<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Modern Detailing Studio Atmospheric Lighting -->
    <linearGradient id="washFacilityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="50%" stop-color="#0a1529" />
      <stop offset="100%" stop-color="#0f1f3d" />
    </linearGradient>

    <!-- Overhead LED Hexagon Studio Ceiling Gradients -->
    <linearGradient id="ledGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Luxury Sports Sedan Metallic Paint Shimmer (Sapphire Midnight Blue) -->
    <linearGradient id="carBodyPaint" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="65%" stop-color="#0369a1" />
      <stop offset="85%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Windshield & Tinted Glass with Specular Reflection -->
    <linearGradient id="carGlassTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>

    <!-- High-gloss Wet Reflection Wet Floor -->
    <linearGradient id="wetFloorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b30" />
      <stop offset="40%" stop-color="#07101f" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Water Mist / Foam Dispersion Gradient -->
    <radialGradient id="mistGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#0ea5e9" stop-opacity="0.1" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- HUD Card Background -->
    <linearGradient id="hudGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(10, 20, 42, 0.9)" />
      <stop offset="100%" stop-color="rgba(3, 7, 18, 0.95)" />
    </linearGradient>

    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Facility Interior Background -->
  <rect width="800" height="500" fill="url(#washFacilityBg)" />

  <!-- Detailing Studio Overhead LED Hexagon Light Tunnel Array -->
  <g stroke="url(#ledGlow)" stroke-width="2.5" fill="none" opacity="0.85" filter="url(#carGlow)">
    <!-- Hexagon Array Level 1 -->
    <polygon points="200,20 240,40 240,80 200,100 160,80 160,40" />
    <polygon points="300,20 340,40 340,80 300,100 260,80 260,40" />
    <polygon points="400,20 440,40 440,80 400,100 360,80 360,40" />
    <polygon points="500,20 540,40 540,80 500,100 460,80 460,40" />
    <polygon points="600,20 640,40 640,80 600,100 560,80 560,40" />
    
    <!-- Overhead Arch Wash Jets Bar -->
    <line x1="80" y1="120" x2="720" y2="120" stroke="#38bdf8" stroke-width="3" />
    <!-- Pressure Jet Spray Nozzles -->
    <circle cx="160" cy="120" r="4" fill="#38bdf8" />
    <circle cx="280" cy="120" r="4" fill="#38bdf8" />
    <circle cx="400" cy="120" r="4" fill="#38bdf8" />
    <circle cx="520" cy="120" r="4" fill="#38bdf8" />
    <circle cx="640" cy="120" r="4" fill="#38bdf8" />
  </g>

  <!-- High-Pressure Foam Spray Particle Cones -->
  <g opacity="0.35">
    <polygon points="160,120 120,240 200,240" fill="url(#mistGlow)" />
    <polygon points="280,120 240,230 320,230" fill="url(#mistGlow)" />
    <polygon points="400,120 350,220 450,220" fill="url(#mistGlow)" />
    <polygon points="520,120 480,230 560,230" fill="url(#mistGlow)" />
    <polygon points="640,120 600,240 680,240" fill="url(#mistGlow)" />
  </g>

  <!-- High Gloss Wet Studio Epoxy Floor with Perspective Grid -->
  <polygon points="0,320 800,320 800,500 0,500" fill="url(#wetFloorGrad)" />
  <g stroke="#1e3a5f" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="410" x2="800" y2="410" />
    <line x1="0" y1="465" x2="800" y2="465" />
    <!-- Perspective guide lines into distance -->
    <line x1="400" y1="320" x2="0" y2="480" />
    <line x1="400" y1="320" x2="200" y2="500" />
    <line x1="400" y1="320" x2="600" y2="500" />
    <line x1="400" y1="320" x2="800" y2="480" />
  </g>

  <!-- ======================================================== -->
  <!-- REALISTIC LUXURY AUTOMATED CAR DETAILING PROFILE         -->
  <!-- ======================================================== -->
  
  <!-- Car Shadow on Wet Floor -->
  <ellipse cx="395" cy="385" rx="275" ry="24" fill="#020617" opacity="0.85" />
  <ellipse cx="395" cy="380" rx="230" ry="14" fill="#020617" opacity="0.95" />

  <!-- Car Silhouette & Chassis (Sleek Modern Performance Sedan) -->
  <g id="carModel">
    <!-- Main Aerodynamic Body Shell -->
    <path d="M 160 325 
             C 170 300, 210 280, 270 265 
             C 320 230, 380 205, 470 205 
             C 530 205, 570 225, 610 260 
             C 645 270, 675 285, 680 315 
             C 685 330, 680 345, 660 350
             L 640 350
             C 630 315, 595 290, 560 290
             C 525 290, 495 315, 485 350
             L 300 350
             C 290 315, 255 290, 220 290
             C 185 290, 155 315, 145 350
             L 125 350
             C 115 345, 130 330, 160 325 Z" 
          fill="url(#carBodyPaint)" stroke="#38bdf8" stroke-width="1.2" />

    <!-- Sleek Curved Aerodynamic Greenhouse / Roof & Window Glass -->
    <path d="M 285 262 
             C 330 235, 385 212, 470 212 
             C 525 212, 560 230, 598 258 
             L 480 258 
             Z" 
          fill="url(#carGlassTint)" stroke="#38bdf8" stroke-width="0.8" />

    <!-- Side Window Pillar Details (B-Pillar) -->
    <line x1="440" y1="214" x2="445" y2="258" stroke="#0f172a" stroke-width="4" />

    <!-- High-Gloss Wet Body Sheen / Reflection Highlight Lines -->
    <path d="M 165 315 C 230 280, 340 265, 490 265 C 570 265, 630 285, 665 315" 
          fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.8" filter="url(#carGlow)" />
    
    <path d="M 290 260 C 370 220, 460 215, 510 215" 
          fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.9" />

    <!-- Front LED Matrix Laser Headlight (Crisp Electric Blue Glow) -->
    <polygon points="635,290 668,300 655,308 625,300" fill="#38bdf8" filter="url(#carGlow)" />
    <polygon points="640,293 664,300 653,306 632,300" fill="#ffffff" />
    <line x1="668" y1="300" x2="780" y2="305" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.75" filter="url(#carGlow)" />

    <!-- Rear Tail-Light Modern LED Strip -->
    <path d="M 132 334 C 145 328, 155 326, 170 326" stroke="#ef4444" stroke-width="3" fill="none" filter="url(#carGlow)" />

    <!-- Alloy Sports Wheels & Calipers -->
    <!-- Front Wheel Assembly -->
    <g transform="translate(560, 350)">
      <circle cx="0" cy="0" r="42" fill="#090d16" stroke="#475569" stroke-width="3" />
      <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Sports Brembo Blue Caliper -->
      <path d="M -15 -18 A 24 24 0 0 1 12 -22" stroke="#0ea5e9" stroke-width="7" fill="none" />
      <!-- Star Spokes -->
      <line x1="0" y1="0" x2="0" y2="-28" stroke="#94a3b8" stroke-width="3" />
      <line x1="0" y1="0" x2="26" y2="-9" stroke="#94a3b8" stroke-width="3" />
      <line x1="0" y1="0" x2="16" y2="23" stroke="#94a3b8" stroke-width="3" />
      <line x1="0" y1="0" x2="-16" y2="23" stroke="#94a3b8" stroke-width="3" />
      <line x1="0" y1="0" x2="-26" y2="-9" stroke="#94a3b8" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#0284c7" />
    </g>

    <!-- Rear Wheel Assembly -->
    <g transform="translate(220, 350)">
      <circle cx="0" cy="0" r="42" fill="#090d16" stroke="#475569" stroke-width="3" />
      <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="-28" stroke="#94a3b8" stroke-width="3" />
      <line x1="0" y1="0" x2="26" y2="-9" stroke="#94a3b8" stroke-width="3" />
      <line x1="0" y1="0" x2="16" y2="23" stroke="#94a3b8" stroke-width="3" />
      <line x1="0" y1="0" x2="-16" y2="23" stroke="#94a3b8" stroke-width="3" />
      <line x1="0" y1="0" x2="-26" y2="-9" stroke="#94a3b8" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#0284c7" />
    </g>
  </g>

  <!-- Wet Floor Reflection of Vehicle Underbody -->
  <g opacity="0.25" transform="matrix(1 0 0 -0.4 0 520)">
    <path d="M 160 325 C 210 280, 470 205, 680 315 L 640 350 L 125 350 Z" fill="#0284c7" filter="url(#carGlow)" />
  </g>

  <!-- ======================================================== -->
  <!-- AUTOMATED DETAILING PIPELINE HUD / TELEMETRY OVERLAY     -->
  <!-- ======================================================== -->
  
  <!-- Top Station Status Header -->
  <g transform="translate(24, 24)">
    <rect width="752" height="42" rx="10" fill="url(#hudGlass)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="22" cy="21" r="5" fill="#38bdf8" filter="url(#carGlow)" />
    <circle cx="22" cy="21" r="9" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    
    <text x="40" y="26" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.05em">AUTOSPA PRO FACILITY</text>
    <text x="220" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">| BAY #03 AUTOMATED WASH CYCLE</text>
    
    <rect x="635" y="10" width="102" height="22" rx="5" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="0.8" />
    <text x="686" y="25" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">ACTIVE WASHING</text>
  </g>

  <!-- Left Floating Widget: Service & Stage -->
  <g transform="translate(24, 82)">
    <rect width="210" height="96" rx="12" fill="url(#hudGlass)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">CURRENT PACKAGE</text>
    <text x="16" y="50" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Deep Detailing Pro</text>
    <rect x="16" y="62" width="178" height="6" rx="3" fill="#1e293b" />
    <rect x="16" y="62" width="128" height="6" rx="3" fill="url(#ledGlow)" />
    <text x="16" y="82" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">Stage 3/4: High-Gloss Ceramic</text>
  </g>

  <!-- Right Floating Widget: Water Pressure & Drying Telemetry -->
  <g transform="translate(566, 82)">
    <rect width="210" height="96" rx="12" fill="url(#hudGlass)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">BAY #03 DIAGNOSTICS</text>
    <text x="16" y="52" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#38bdf8">140 BAR</text>
    <text x="110" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">● 65°C FOAM</text>
    <text x="16" y="78" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Dryer Air Speed: <tspan fill="#f8fafc" font-weight="700">220 km/h</tspan></text>
  </g>

  <!-- Bottom Floating Bay Queue & Booking Notification -->
  <g transform="translate(210, 442)">
    <rect width="380" height="34" rx="8" fill="rgba(8, 15, 30, 0.9)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#10b981" filter="url(#carGlow)" />
    <text x="32" y="21" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#f8fafc">
      NEXT APPOINTMENT: <tspan fill="#38bdf8">BMW M3 (14:30)</tspan> • BAY EFFICIENCY: 99.2%
    </text>
  </g>
</svg>
