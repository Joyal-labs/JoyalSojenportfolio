<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Sky & Atmospheric Lighting -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051329" />
      <stop offset="45%" stop-color="#0a2540" />
      <stop offset="80%" stop-color="#143c68" />
      <stop offset="100%" stop-color="#1b497a" />
    </linearGradient>

    <!-- Sun & Intense Solar Glow -->
    <radialGradient id="sunBurst" cx="72%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#051329" stop-opacity="0" />
    </radialGradient>

    <!-- Photovoltaic Silicon Cell Gradient -->
    <linearGradient id="panelGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2447" />
      <stop offset="40%" stop-color="#07182e" />
      <stop offset="70%" stop-color="#040d1a" />
      <stop offset="100%" stop-color="#02070f" />
    </linearGradient>

    <!-- Telemetry Card Glass -->
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.88)" />
      <stop offset="100%" stop-color="rgba(3, 7, 18, 0.94)" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern for Silicon Wafers -->
    <pattern id="solarGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#38bdf8" stroke-width="0.35" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Sky Base -->
  <rect width="800" height="500" fill="url(#skyGrad)" />
  <rect width="800" height="500" fill="url(#sunBurst)" />

  <!-- Mountainous / Rooftop Horizon Line -->
  <path d="M 0 240 Q 220 200 440 230 T 800 210 L 800 270 L 0 270 Z" fill="#08182b" opacity="0.85" />
  <path d="M 0 250 L 800 250 L 800 500 L 0 500 Z" fill="#061220" />

  <!-- Realistic Rooftop Commercial Facility Structure -->
  <polygon points="0,270 800,260 800,500 0,500" fill="#09182a" />
  
  <!-- Perspective Solar Panel Arrays (Row 3 - Distant) -->
  <g opacity="0.6">
    <polygon points="40,250 180,248 160,268 20,270" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.6" />
    <polygon points="200,248 340,246 320,266 180,268" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.6" />
    <polygon points="360,246 500,244 480,264 340,266" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.6" />
    <polygon points="520,244 660,242 640,262 500,264" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.6" />
    <polygon points="680,242 790,241 780,260 660,262" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.6" />
  </g>

  <!-- Perspective Solar Panel Arrays (Row 2 - Midground) -->
  <g opacity="0.85">
    <polygon points="30,278 200,274 175,310 5,315" fill="url(#panelGlass)" stroke="#0ea5e9" stroke-width="0.8" />
    <rect x="30" y="278" width="170" height="32" fill="url(#solarGrid)" opacity="0.4" transform="skewX(-28)" />
    
    <polygon points="220,274 390,270 365,306 195,310" fill="url(#panelGlass)" stroke="#0ea5e9" stroke-width="0.8" />
    <polygon points="410,270 580,266 555,302 385,306" fill="url(#panelGlass)" stroke="#0ea5e9" stroke-width="0.8" />
    <polygon points="600,266 770,262 745,298 575,302" fill="url(#panelGlass)" stroke="#0ea5e9" stroke-width="0.8" />
  </g>

  <!-- Perspective Solar Panel Arrays (Row 1 - Foreground Realistic Solar Farm) -->
  <g id="foregroundArray">
    <!-- Panel 1 -->
    <polygon points="0,335 240,328 205,420 -35,430" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="120" y1="331" x2="85" y2="425" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="-15" y1="382" x2="222" y2="374" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5" />

    <!-- Panel 2 -->
    <polygon points="265,327 505,320 470,410 230,418" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="385" y1="323" x2="350" y2="414" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="247" y1="372" x2="487" y2="365" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5" />
    
    <!-- Cell Grid Texture on Panel 2 -->
    <g opacity="0.25">
      <line x1="325" y1="325" x2="290" y2="416" stroke="#38bdf8" stroke-width="0.4" />
      <line x1="445" y1="321" x2="410" y2="412" stroke="#38bdf8" stroke-width="0.4" />
      <line x1="256" y1="350" x2="496" y2="342" stroke="#38bdf8" stroke-width="0.4" />
      <line x1="239" y1="395" x2="479" y2="387" stroke="#38bdf8" stroke-width="0.4" />
    </g>

    <!-- Panel 3 -->
    <polygon points="530,319 770,312 735,400 495,408" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="650" y1="315" x2="615" y2="404" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="512" y1="363" x2="752" y2="356" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5" />

    <!-- Sun specular sheen across glass -->
    <polygon points="340,324 460,321 380,413 260,416" fill="#38bdf8" opacity="0.12" />
  </g>

  <!-- ======================================================== -->
  <!-- ENTERPRISE TELEMETRY OVERLAY HUD                         -->
  <!-- ======================================================== -->
  
  <!-- Ambient Top Gradient Overlay for Contrast -->
  <rect x="0" y="0" width="800" height="160" fill="url(#cardGlass)" opacity="0.45" />

  <!-- Top Telemetry Status Header -->
  <g transform="translate(24, 24)">
    <!-- Header Bar Container -->
    <rect width="752" height="42" rx="10" fill="url(#cardGlass)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    
    <!-- Status Indicator Pulse -->
    <circle cx="22" cy="21" r="5" fill="#10b981" filter="url(#neonGlow)" />
    <circle cx="22" cy="21" r="9" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" />
    
    <!-- Title & Breadcrumbs -->
    <text x="40" y="26" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.05em">SOLAROPS ENTERPRISE</text>
    <text x="212" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">| LIVE TELEMETRY &amp; KSEB GRID SYNC</text>
    
    <!-- Protocol Badge -->
    <rect x="625" y="10" width="112" height="22" rx="5" fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" stroke-width="0.8" />
    <text x="681" y="25" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">RBAC: 5-TIER ACTIVE</text>
  </g>

  <!-- Telemetry Card 1: Live Generation & Peak kW -->
  <g transform="translate(24, 82)">
    <rect width="210" height="106" rx="12" fill="url(#cardGlass)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">LIVE INVERTER OUTPUT</text>
    
    <!-- Large Metric -->
    <text x="16" y="62" font-family="'Montserrat', sans-serif" font-size="28" font-weight="800" fill="#38bdf8" filter="url(#neonGlow)">148.4</text>
    <text x="108" y="60" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">kW</text>
    
    <!-- Secondary Metric & Badge -->
    <rect x="16" y="74" width="76" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="0.6" />
    <text x="54" y="87" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34d399" text-anchor="middle">▲ 98.6% EFF</text>
    <text x="102" y="87" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Daily: 842 kWh</text>
  </g>

  <!-- Telemetry Card 2: Real-time Power Curve Waveform -->
  <g transform="translate(250, 82)">
    <rect width="290" height="106" rx="12" fill="url(#cardGlass)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">DIURNAL SOLAR CURVE</text>
    <text x="210" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f59e0b">PEAK: 12:45 PM</text>
    
    <!-- Graph Background Grid Lines -->
    <line x1="16" y1="42" x2="274" y2="42" stroke="#1e293b" stroke-dasharray="2 2" stroke-width="0.8" />
    <line x1="16" y1="62" x2="274" y2="62" stroke="#1e293b" stroke-dasharray="2 2" stroke-width="0.8" />
    <line x1="16" y1="82" x2="274" y2="82" stroke="#1e293b" stroke-dasharray="2 2" stroke-width="0.8" />
    
    <!-- Area Under Curve -->
    <path d="M 16 88 Q 80 86 110 58 T 160 38 T 210 52 T 274 88 L 274 88 L 16 88 Z" fill="rgba(56, 189, 248, 0.18)" />
    <!-- Telemetry Glowing Waveform -->
    <path d="M 16 88 Q 80 86 110 58 T 160 38 T 210 52 T 274 88" fill="none" stroke="#38bdf8" stroke-width="2.2" filter="url(#neonGlow)" />
    
    <!-- Current Peak Marker Dot -->
    <circle cx="160" cy="38" r="4" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="160" y="30" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">148 kW</text>
  </g>

  <!-- Telemetry Card 3: KSEB Grid Pipeline & Approval Status -->
  <g transform="translate(556, 82)">
    <rect width="220" height="106" rx="12" fill="url(#cardGlass)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">KSEB GRID FEEDER STATUS</text>
    
    <!-- Grid Sync Telemetry -->
    <text x="16" y="52" font-family="'Montserrat', sans-serif" font-size="15" font-weight="800" fill="#f8fafc">415V / 50.02 Hz</text>
    <text x="16" y="68" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">● NET METERING SYNCED</text>
    
    <!-- Application Progress Bar -->
    <rect x="16" y="78" width="188" height="6" rx="3" fill="#1e293b" />
    <rect x="16" y="78" width="160" height="6" rx="3" fill="url(#skyGrad)" stroke="#38bdf8" stroke-width="0.5" />
    <text x="16" y="96" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Approval Stage: <tspan fill="#38bdf8" font-weight="700">Phase 4 Feasibility</tspan></text>
  </g>

  <!-- Bottom Floating HUD Banner -->
  <g transform="translate(200, 442)">
    <rect width="400" height="34" rx="8" fill="rgba(8, 15, 30, 0.88)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="24" cy="17" r="4" fill="#38bdf8" filter="url(#neonGlow)" />
    <text x="38" y="21" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#f8fafc">
      SYSTEM: <tspan fill="#34d399">OPTIMAL</tspan> • TILT: 18° S • SENSORS: 48/48 ONLINE
    </text>
  </g>
</svg>
